name: release

# Tag-triggered release: `git tag -a v0.2 && git push origin v0.2` → precision +
# perf gates on both platforms, then cross-platform builds and a Draft Release
# with the packaged artifacts plus a warm-start perf smoke. `workflow_dispatch`
# lets you dry-run the whole chain with `version: v0.2` on the default branch
# without pushing a tag (use branch filter in the Actions UI).

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'override tag (e.g. v0.2); on tags this is github.ref_name'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-macos:
    runs-on: macos-14
    timeout-minutes: 50
    env:
      CULL_VERSION: ${{ inputs.version != '' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
      - name: Install runtime deps into .venv
        run: |
          uv venv .venv --python 3.10
          uv pip install --python .venv/bin/python \
            "opencv-python==5.0.0.93" "onnxruntime==1.23.2" "numpy>=1.26" \
            "pillow>=10.0" "pillow-heif>=0.18.0" "av>=17.0" "scipy>=1.15" \
            "pyinstaller" "pytest"
      - name: Resolve release version
        id: ver
        run: |
          RAW="${{ env.CULL_VERSION }}"
          RAW="${RAW:-$(grep -E '^\s*version\s*=' pyproject.toml | sed -E 's/.*\"([^\"]+)\".*/\1/')}"
          VER="${RAW#v}"; VER="${VER:-0.2}"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "CULL_VERSION=$VER" >> "$GITHUB_ENV"
          echo "Release version: v$VER (source: CULL_VERSION=${{ env.CULL_VERSION }})"
      - name: Precision gate
        timeout-minutes: 10
        run: |
          .venv/bin/python packaging/build.py --onedir
          .venv/bin/python -m pytest tests/test_deterministic_baseline.py -v -m "deterministic"
          .venv/bin/python tests/ci/seed_precision.py --compare
      - name: Perf gate (seed steady state, source)
        timeout-minutes: 25
        run: |
          .venv/bin/python benchmarks/run_benchmarks.py --workers 2 \
            --seed-dir tests/ci/sample --count 120 --samples 2 \
            --tolerance 0.75 --baseline-file tests/ci/ci_config.json \
            --no-prewarm --json build/ci_source.json
      - name: Build Desktop GUI (DMG)
        run: |
          VER="${{ steps.ver.outputs.ver }}"
          echo "Building Desktop GUI DMG Installer v$VER ..."
          .venv/bin/python packaging/build_gui.py
          ls -lh dist/AutoCulling_*.dmg || true
      # No standalone SHA256 step: build_gui.py emits .sha256 for every
      # collected release artifact (DMG). The onedir dir from the Precision
      # gate step stays in dist/ purely as the warm-start smoke fixture.
      - name: Smoke — warm-start perf (packaged binary)
        timeout-minutes: 25
        run: |
          VER="${{ steps.ver.outputs.ver }}"
          ONEDIR_EXE="dist/auto_cull_v${VER}_macos_arm64/auto_cull_v${VER}_macos_arm64"
          test -x "$ONEDIR_EXE" || { echo "missing executable $ONEDIR_EXE"; exit 1; }
          CULL_EXE="$ONEDIR_EXE" .venv/bin/python benchmarks/run_benchmarks.py --workers 2 \
            --seed-dir tests/ci/sample --count 120 --samples 2 \
            --tolerance 0.75 --baseline-file tests/ci/ci_config.json \
            --json build/ci_onedir.json
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-v${{ steps.ver.outputs.ver }}
          if-no-files-found: error
          path: |
            dist/AutoCulling_*.dmg*
            dist/*.sha256
            build/ci_*.json

  build-windows:
    runs-on: windows-latest
    timeout-minutes: 50
    env:
      CULL_VERSION: ${{ inputs.version != '' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.10"
      - name: Install runtime deps into .venv + exiftool
        run: |
          choco install exiftool -y --no-progress
          uv venv .venv --python 3.10
          uv pip install --python .venv `
            "opencv-python==5.0.0.93" "onnxruntime==1.23.2" "numpy>=1.26" `
            "pillow>=10.0" "pillow-heif>=0.18.0" "av>=17.0" "scipy>=1.15" `
            "pyinstaller" "pytest"
      - name: Resolve release version
        id: ver
        shell: bash
        run: |
          RAW="${{ env.CULL_VERSION }}"
          if [ -z "$RAW" ]; then RAW="$(grep -E '^\s*version\s*=' pyproject.toml | sed -E 's/.*\"([^\"]+)\".*/\1/')"; fi
          VER="${RAW#v}"; VER="${VER:-0.2}"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "CULL_VERSION=$VER" >> "$GITHUB_ENV"
          echo "Release version: v$VER"
      - name: Precision gate
        timeout-minutes: 10
        run: |
          .venv/Scripts/python.exe packaging/build.py --onedir
          .venv/Scripts/python.exe -m pytest tests/test_deterministic_baseline.py -v -m "deterministic"
          .venv/Scripts/python.exe tests/ci/seed_precision.py --compare
      - name: Perf gate (seed steady state, source)
        timeout-minutes: 25
        run: |
          .venv/Scripts/python.exe benchmarks/run_benchmarks.py --workers 4 `
            --seed-dir tests/ci/sample --count 120 --samples 2 --tolerance 0.65 `
            --baseline-file tests/ci/ci_config.json --no-prewarm `
            --json build/ci_source.json
      - name: Build Desktop GUI (Setup + Portable)
        shell: bash
        run: |
          VER="${{ steps.ver.outputs.ver }}"
          echo "Building Windows Desktop GUI Packages v$VER ..."
          .venv/Scripts/python.exe packaging/build_gui.py
          ls -lh dist/AutoCulling_* || true
      # No standalone SHA256 step: build_gui.py emits .sha256 for every
      # collected release artifact (setup.exe + portable.zip). The onedir dir
      # from the Precision gate step stays in dist/ purely as the warm-start
      # smoke fixture.
      - name: Smoke — warm-start perf (packaged binary)
        timeout-minutes: 25
        run: |
          $ver = "${{ steps.ver.outputs.ver }}"
          $exe = "dist/auto_cull_v${ver}_win_x64/auto_cull_v${ver}_win_x64.exe"
          if (-not (Test-Path $exe)) { Write-Error "missing $exe"; exit 1 }
          $env:CULL_EXE = (Resolve-Path $exe).Path
          .venv/Scripts/python.exe benchmarks/run_benchmarks.py --workers 4 `
            --seed-dir tests/ci/sample --count 120 --samples 2 --tolerance 0.65 `
            --baseline-file tests/ci/ci_config.json `
            --json build/ci_onedir.json
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-v${{ steps.ver.outputs.ver }}
          if-no-files-found: error
          path: |
            dist/AutoCulling_*.exe*
            dist/AutoCulling_*.zip*
            dist/*.sha256
            build/ci_*.json

  create-draft-release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Stage release assets (GUI packages; CLI bundled inside)
        run: |
          mkdir -p release_assets
          find artifacts -name 'AutoCulling_*.dmg' -exec cp -v {} release_assets/ \;
          find artifacts -name 'AutoCulling_*.exe' -exec cp -v {} release_assets/ \;
          find artifacts -name 'AutoCulling_*.zip' -exec cp -v {} release_assets/ \;
          find artifacts -name '*.sha256' -exec cp -v {} release_assets/ \;
          echo "Staged release assets:"; ls -lh release_assets/; cat release_assets/*.sha256 2>/dev/null || true
      - name: Derive tag + what changed vs last release
        id: tag
        run: |
          TAG="${{ inputs.version != '' && inputs.version || github.ref_name }}"
          TAG="${TAG:-v0.2}"
          [[ "$TAG" == v* ]] || TAG="v$TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG"
          git fetch --tags --force
          PREV="$(git tag --sort=-v:refname | grep -E '^v[0-9]' | head -1)"
          # On first v0.2 the previous tag is v0.1; on v0.2 dry-runs the tag doesn't exist yet
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            PREV="$(git describe --tags --abbrev=0 "$TAG^" 2>/dev/null || echo v0.1)"
          else
            PREV="${PREV:-v0.1}"
            # If workflow_dispatch on master without a new tag, PREV is the latest tag
            if [ "$TAG" = "$PREV" ]; then PREV="v0.1"; fi
          fi
          if ! git rev-parse "$PREV" >/dev/null 2>&1; then PREV="v0.1"; fi
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"
          echo "Previous release tag: $PREV → $TAG"
          echo "### Commits since $PREV" > /tmp/what_changed.md
          echo "" >> /tmp/what_changed.md
          git log --oneline --no-merges "$PREV"..HEAD | head -80 >> /tmp/what_changed.md || echo "(no commits found)" >> /tmp/what_changed.md
          echo "" >> /tmp/what_changed.md
          echo "Full diff: [\`$PREV...$TAG\`](https://github.com/${{ github.repository }}/compare/$PREV...$TAG)" >> /tmp/what_changed.md
          cat /tmp/what_changed.md
          # Also stash a shortstat for the body
          git diff --shortstat "$PREV"..HEAD > /tmp/shortstat.txt 2>/dev/null || true
          cat /tmp/shortstat.txt
          find artifacts -type f | sort
          du -sh artifacts/*/* 2>/dev/null | head -20
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: release_assets/*
          body: |
            ## Auto-Culling ${{ steps.tag.outputs.tag }} — Draft

            Automated culling for F1 & motorsport burst photography.
            Previous release: `${{ steps.tag.outputs.prev }}` → `${{ steps.tag.outputs.tag }}` · [full diff](https://github.com/${{ github.repository }}/compare/${{ steps.tag.outputs.prev }}...${{ steps.tag.outputs.tag }})

            ### Download — Desktop GUI + bundled CLI (Recommended)

            | Platform | Format | Package |
            | --- | --- | --- |
            | Windows x64 | Setup Installer (NSIS) | `AutoCulling_v*_win_x64_setup.exe` |
            | Windows x64 | Portable (No install required) | `AutoCulling_v*_win_x64_portable.zip` |
            | macOS Apple Silicon | DMG Drag-to-Install | `AutoCulling_v*_macos_arm64.dmg` |

            GUI executable: `auto_culling(.exe)`. CLI is bundled inside every
            package (same engine, console entry point):
            - Windows: `<install dir>\sidecar\auto_culling_cli.exe`
            - macOS:   `AutoCulling.app/Contents/Resources/sidecar/auto_culling_cli`

            Each package ships with a `.sha256` — verify with `shasum -a 256 <file>` / `Get-FileHash -Algorithm SHA256`.

            ```powershell
            # Windows — CLI batch culling (portable unzip or default install dir)
            .\sidecar\auto_culling_cli.exe --input-dir C:\Photos\F1 --recursive --force
            ```

            ```bash
            # macOS — CLI batch culling
            /Applications/AutoCulling.app/Contents/Resources/sidecar/auto_culling_cli --input-dir /path/to/photos --recursive --force
            ```

            Omit `--input-dir` to open a folder picker. `--force` re-analyzes already-rated files.

            ### What changed since ${{ steps.tag.outputs.prev }}

            See the auto-generated release notes below (GitHub's `generate_release_notes`) and the [full diff](https://github.com/${{ github.repository }}/compare/${{ steps.tag.outputs.prev }}...${{ steps.tag.outputs.tag }}). The detailed commit list since the previous tag is also printed in the workflow log's "Derive tag + what changed vs last release" step.

            ### Performance
            Gate protocol (~500 real files/format steady state; see [results/performance_baseline.md](https://github.com/${{ github.repository }}/blob/${{ steps.tag.outputs.tag }}/results/performance_baseline.md)). This tag was gated on the seed replication protocol (4 seed files ×120 copies ×2 samples, `tests/ci/ci_config.json`) — precision + source perf on both platforms plus a warm-start perf smoke on the packaged onedir binary. `packaging/guards.py` (full 1.3 GB suite) was green on the M4 dev box before merge.

            ### Verification
            - `pytest -m deterministic` and `tests/ci/seed_precision.py --compare` green on macOS-14 + windows-latest.
            - `benchmarks/run_benchmarks.py --seed-dir tests/ci/sample --count 120` green on both OSes.
            - Bundled ONNX models (f1_yolov8n / yolov8n / p4_car_model) + exiftool; no Python install required.

            > This is a **draft** — review the files and notes, then Publish.
