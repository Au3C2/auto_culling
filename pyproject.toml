[project]
name = "AutoCullingF1"
version = "0.4"
description = "F1 motorsport photo auto-culling (ONNX LITE VERSION)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "tqdm>=4.67.3",
    "pillow-heif>=0.18.0",
    "pillow-avif-plugin>=1.5.5",
    "opencv-python-headless>=4.10.0",
    # Windows: DirectML build (measured ~2x faster scoring-chain inference
    # than the CUDA EP on RTX 4070 Ti, 2026-08-30; CUDA build kept elsewhere).
    "onnxruntime-directml==1.23.0; sys_platform == 'win32'",
    "onnxruntime==1.23.2; sys_platform != 'win32'",
    "onnx>=1.17.0",
    "numpy>=1.26.0",
    "pillow>=10.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["cull"]

[tool.uv]
package = true
